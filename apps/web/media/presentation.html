<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>OvertChat README media</title>
    <style>
      /* This frame surrounds real captures. It never recreates product UI. */
      * { box-sizing: border-box; }
      body { margin: 0; }
      #frame { padding: 24px; background: var(--background); }
      #capture { display: block; width: 100%; outline: 1px solid var(--border); outline-offset: -1px; border-radius: 14px; }
      #banner { display: flex; align-items: center; justify-content: center; width: 800px; height: 156px; color: var(--foreground); background: var(--background); font-family: var(--font-fraunces); font-size: 88px; font-weight: 500; letter-spacing: -4px; }
    </style>
  </head>
  <body></body>
</html>
