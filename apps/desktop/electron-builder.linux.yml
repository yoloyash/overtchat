extends: ./electron-builder.yml
toolsets:
  # Builder's recommended static runtime avoids the obsolete FUSE 2 dependency.
  appimage: "1.0.3"
electronFuses:
  enableNodeCliInspectArguments: false
linux:
  target:
    - AppImage
    - deb
    - rpm
    - tar.gz
  executableName: overtchat-desktop
  # These targets call x64 x86_64/amd64 differently; keep download names uniform.
  artifactName: overtchat-${version}-linux-x64.${ext}
  syncDesktopName: true
  category: Network
  icon: build/icon.png
  maintainer: "OvertChat contributors <yash@boomer-hub.uk>"
  vendor: OvertChat
  desktop:
    entry:
      Keywords: chat;AI;
appImage:
  # Preserve the executable path across updates, including user-created shortcuts.
  artifactName: overtchat-linux-x64.AppImage
  # Do not disable the sandbox in the desktop entry. Main also refuses the
  # runtime launcher's --no-sandbox fallback before any renderer is created.
  executableArgs: []
deb:
  packageName: overtchat-desktop
  # Builder's defaults omit Chromium's audio library on minimal installations.
  # The alternative covers Ubuntu before and after the time64 transition.
  depends:
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0
    - libuuid1
    - libsecret-1-0
    - libasound2 | libasound2t64
  afterInstall: build/linux/after-install.tpl
rpm:
  packageName: overtchat-desktop
  afterInstall: build/linux/after-install.tpl
  fpm:
    - --rpm-posttrans
    - build/linux/after-transaction.sh
