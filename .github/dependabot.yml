version: 2

updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      # Better Auth pins its own packages exactly — better-auth depends on
      # @better-auth/core@=X while @better-auth/expo peers on ^X — so bumping one
      # package alone leaves two copies of core in the tree. TypeScript then
      # treats their declarations as unrelated types and the admin() plugin's
      # module augmentation stops applying, which drops session.user.role and
      # fails the web build. Keep the family in one pull request.
      better-auth:
        patterns:
          - better-auth
          - "@better-auth/*"
      better-auth-security:
        applies-to: security-updates
        patterns:
          - better-auth
          - "@better-auth/*"
      # Expo packages are versioned as one SDK release and are pinned to it with
      # tilde ranges. A single-package bump is not a supported configuration, so
      # group them; the resulting pull request is a prompt to run the SDK upgrade
      # with `npx expo install --fix` rather than something to merge as-is.
      expo:
        patterns:
          - expo
          - "expo-*"
          - "@expo/*"
          - react-native
          - "react-native-*"
      expo-security:
        applies-to: security-updates
        patterns:
          - expo
          - "expo-*"
          - "@expo/*"
          - react-native
          - "react-native-*"
      # Everything else travels together so a week of routine bumps is one review.
      npm:
        exclude-patterns:
          - better-auth
          - "@better-auth/*"
          - expo
          - "expo-*"
          - "@expo/*"
          - react-native
          - "react-native-*"
      npm-security:
        applies-to: security-updates
        patterns:
          - "*"
        exclude-patterns:
          - better-auth
          - "@better-auth/*"
          - expo
          - "expo-*"
          - "@expo/*"
          - react-native
          - "react-native-*"
