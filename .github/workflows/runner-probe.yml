name: runner-probe

on:
  workflow_dispatch:

permissions: {}

jobs:
  probe:
    runs-on: [self-hosted, macOS, ARM64]
    defaults:
      run:
        shell: bash
    steps:
      - name: Toolchain
        run: |
          sw_vers -productVersion
          xcodebuild -version
          echo "PATH=$PATH"

      - name: Codesign identity is visible
        run: |
          security find-identity -v -p codesigning
          IDENTITY="$(security find-identity -v -p codesigning | awk '/"Apple Development:/ { print $2; exit }')"
          test -n "$IDENTITY"
          echo "IDENTITY=$IDENTITY" >> "$GITHUB_ENV"

      - name: Compile, sign, and verify a scratch binary
        run: |
          set -euo pipefail
          bin="$RUNNER_TEMP/probe-$GITHUB_RUN_ID"
          printf 'int main(void){return 0;}' > "$bin.c"
          cc -o "$bin" "$bin.c"
          codesign --force --timestamp=none -s "$IDENTITY" "$bin"
          codesign --verify --strict --verbose=2 "$bin"
          codesign -d --entitlements :- "$bin" 2>&1 | grep -E 'get-task-allow' || true
          codesign -dvv "$bin" 2>&1 | grep -E 'Authority=|TeamIdentifier='
          rm -f "$bin" "$bin.c"
          echo "SIGN-AND-VERIFY OK"
