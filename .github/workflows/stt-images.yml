name: Build and publish STT images

# Tag a release with `stt-v<semver>` (e.g. `stt-v0.1.0`) to trigger.
# CPU image is built for linux/amd64 + linux/arm64.
# GPU image is built for linux/amd64 only (CUDA is amd64-only in practice).
on:
  push:
    tags: ["stt-v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stt-v* tag to publish
        required: true
        type: string

permissions: {}

concurrency:
  group: stt-images-${{ inputs.tag || github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: ${{ github.repository_owner }}

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      revision: ${{ steps.version.outputs.revision }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Validate release tag
        id: version
        env:
          RELEASE_TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^stt-v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "release tag must be a semantic version such as stt-v0.1.1" >&2
            exit 1
          fi
          version="${BASH_REMATCH[1]}"
          manifest_version=$(node -p "require('./apps/site/public/install-manifest.json').sttVersion")
          if [[ "$manifest_version" != "$version" ]]; then
            echo "release manifest selects $manifest_version, but the release tag is $RELEASE_TAG" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  cpu:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Reuse only the image built from this release commit
        id: image
        uses: ./.github/actions/resolve-owned-image
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/overtchat-stt-cpu:${{ needs.validate.outputs.version }}
          revision: ${{ needs.validate.outputs.revision }}
          version: ${{ needs.validate.outputs.version }}
          platforms: linux/amd64 linux/arm64
          registry-username: ${{ github.actor }}
          registry-token: ${{ secrets.GITHUB_TOKEN }}

      - if: steps.image.outputs.should_build == 'true'
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4

      - id: meta
        if: steps.image.outputs.should_build == 'true'
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/overtchat-stt-cpu
          flavor: latest=false
          tags: type=raw,value=${{ needs.validate.outputs.version }}
          labels: org.opencontainers.image.revision=${{ needs.validate.outputs.revision }}

      - if: steps.image.outputs.should_build == 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: ./stt
          file: ./stt/Dockerfile.cpu
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=stt-cpu
          cache-to: type=gha,scope=stt-cpu,mode=max

  gpu:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Reuse only the image built from this release commit
        id: image
        uses: ./.github/actions/resolve-owned-image
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/overtchat-stt-gpu:${{ needs.validate.outputs.version }}
          revision: ${{ needs.validate.outputs.revision }}
          version: ${{ needs.validate.outputs.version }}
          platforms: linux/amd64
          registry-username: ${{ github.actor }}
          registry-token: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        if: steps.image.outputs.should_build == 'true'
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/overtchat-stt-gpu
          flavor: latest=false
          tags: type=raw,value=${{ needs.validate.outputs.version }}
          labels: org.opencontainers.image.revision=${{ needs.validate.outputs.revision }}

      - if: steps.image.outputs.should_build == 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: ./stt
          file: ./stt/Dockerfile.gpu
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=stt-gpu
          cache-to: type=gha,scope=stt-gpu,mode=max

  promote:
    needs: [cpu, gpu]
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Promote release after both STT images are public
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: >-
          gh workflow run promote-release.yml --ref main
          -f require_complete=false
