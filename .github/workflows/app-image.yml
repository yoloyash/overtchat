name: Build and publish app image

# Tag a release with `v<semver>` (e.g. `v0.2.0`) to trigger.
# Built for linux/amd64 + linux/arm64.
on:
  push:
    tags: ["v*"]

concurrency:
  group: app-image-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: ${{ github.repository_owner }}

jobs:
  app:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}

      - name: Validate release tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "release tag must be a semantic version such as v0.13.5" >&2
            exit 1
          fi

          version="${BASH_REMATCH[1]}"
          compose_version="$(sed -n 's/.*${APP_VERSION:-\([^}]*\)}.*/\1/p' compose.yml)"
          if [[ "$compose_version" != "$version" ]]; then
            echo "compose.yml defaults to $compose_version, but the release tag is $RELEASE_TAG" >&2
            exit 1
          fi

      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/overtchat-app
          tags: |
            type=match,pattern=v(.*),group=1
            type=raw,value=latest

      - uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=app
          cache-to: type=gha,scope=app,mode=max
