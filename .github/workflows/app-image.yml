name: Build and publish app image

# Tag a release with `v<semver>` (e.g. `v0.2.0`) to trigger.
# Built for linux/amd64 + linux/arm64.
on:
  push:
    tags: ["v*"]

permissions: {}

concurrency:
  group: app-image-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_OWNER: ${{ github.repository_owner }}

jobs:
  app:
    outputs:
      version: ${{ steps.version.outputs.version }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.sha }}

      - name: Validate release tag
        id: version
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if [[ ! "$RELEASE_TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "release tag must be a semantic version such as v0.13.5" >&2
            exit 1
          fi

          version="${BASH_REMATCH[1]}"
          # Match the literal Compose interpolation.
          # shellcheck disable=SC2016
          compose_version="$(sed -n 's/.*${APP_VERSION:-\([^}]*\)}.*/\1/p' compose.yml)"
          if [[ "$compose_version" != "$version" ]]; then
            echo "compose.yml defaults to $compose_version, but the release tag is $RELEASE_TAG" >&2
            exit 1
          fi
          manifest_version=$(node -p "require('./apps/site/public/install-manifest.json').appVersion")
          if [[ "$manifest_version" != "$version" ]]; then
            echo "release manifest selects $manifest_version, but the release tag is $RELEASE_TAG" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "revision=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Reuse only the image built from this release commit
        id: image
        uses: ./.github/actions/resolve-owned-image
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/overtchat-app:${{ steps.version.outputs.version }}
          revision: ${{ steps.version.outputs.revision }}
          version: ${{ steps.version.outputs.version }}
          platforms: linux/amd64 linux/arm64
          registry-username: ${{ github.actor }}
          registry-token: ${{ secrets.GITHUB_TOKEN }}

      - if: steps.image.outputs.should_build == 'true'
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4

      - id: meta
        if: steps.image.outputs.should_build == 'true'
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_OWNER }}/overtchat-app
          flavor: latest=false
          tags: type=raw,value=${{ steps.version.outputs.version }}
          labels: org.opencontainers.image.revision=${{ steps.version.outputs.revision }}

      - if: steps.image.outputs.should_build == 'true'
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=app
          cache-to: type=gha,scope=app,mode=max

  release:
    needs: app
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish GitHub release after the image is public
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.app.outputs.version }}
        run: |
          if gh release view "$TAG" --json isDraft --jq '.isDraft' > release-draft; then
            if [ "$(cat release-draft)" = "true" ]; then
              gh release edit "$TAG" --draft=false --latest
            else
              echo "Release $TAG is already public."
            fi
          else
            gh release create "$TAG" \
              --title "OvertChat v$VERSION" \
              --generate-notes \
              --latest \
              --verify-tag
          fi

  promote:
    needs: release
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Promote release after the app image is public
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: >-
          gh workflow run promote-release.yml --ref main
          -f require_complete=false
