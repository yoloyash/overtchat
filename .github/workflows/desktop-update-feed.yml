name: Publish desktop update feed

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Published stable desktop-vX.Y.Z release
        required: true
        type: string

permissions: {}

concurrency:
  group: desktop-update-feed
  cancel-in-progress: false

jobs:
  publish:
    if: github.event_name == 'workflow_dispatch' || (startsWith(github.event.release.tag_name, 'desktop-v') && !github.event.release.prerelease && !github.event.release.draft)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: main
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.x
          cache: npm
      - name: Use pinned npm
        run: npm install --global npm@10.9.8
      - run: npm ci
      - name: Download a published stable desktop release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag || github.event.release.tag_name }}
        run: |
          gh release view "$TAG" --json tagName,isDraft,isPrerelease > release.json
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          const release = JSON.parse(readFileSync('release.json'));
          assert(/^desktop-v(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/.test(process.env.TAG));
          assert.equal(release.tagName, process.env.TAG);
          assert.equal(release.isDraft, false);
          assert.equal(release.isPrerelease, false);
          JS
          gh release download "$TAG" --dir release
          (cd release && sha256sum --check desktop-checksums-arm64.txt && sha256sum --check desktop-checksums-x64.txt && sha256sum --check desktop-checksums-linux-x64.txt)
      - name: Publish and verify the public update feeds
        shell: bash
        env:
          TAG: ${{ inputs.tag || github.event.release.tag_name }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || vars.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_R2_ACCESS_KEY_ID: ${{ secrets.CLOUDFLARE_R2_ACCESS_KEY_ID }}
          CLOUDFLARE_R2_SECRET_ACCESS_KEY: ${{ secrets.CLOUDFLARE_R2_SECRET_ACCESS_KEY }}
          CLOUDFLARE_R2_PUBLIC_URL: ${{ secrets.CLOUDFLARE_R2_PUBLIC_URL }}
          CLOUDFLARE_R2_BUCKET: overtchat-updates
        run: node .github/scripts/publish-desktop-updates.mjs release "$TAG" | tee -a "$GITHUB_STEP_SUMMARY"
