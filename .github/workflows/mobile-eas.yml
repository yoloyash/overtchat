name: Mobile release

on:
  push:
    tags: ["mobile-v*"]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: self-hosted
    permissions:
      contents: read
    outputs:
      expected_tag: ${{ steps.version.outputs.expected_tag }}
      version: ${{ steps.version.outputs.version }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v6
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Check mobile version
        id: version
        run: |
          VERSION="$(node -p "require('./apps/mobile/app.json').expo.version")"
          PACKAGE_VERSION="$(node -p "require('./apps/mobile/package.json').version")"
          VERSION_CODE="$(node -p "require('./apps/mobile/app.json').expo.android.versionCode")"
          EXPECTED_TAG="mobile-v${VERSION}"

          test "$PACKAGE_VERSION" = "$VERSION"
          test "$VERSION_CODE" != "undefined"

          if [[ "${GITHUB_REF_TYPE:-}" == "tag" ]]; then
            test "${GITHUB_REF_NAME}" = "$EXPECTED_TAG"
          fi

          {
            echo "version=$VERSION"
            echo "version_code=$VERSION_CODE"
            echo "expected_tag=$EXPECTED_TAG"
          } >> "$GITHUB_OUTPUT"

      # A secret-visibility DSN is unreadable here and ships crash reporting
      # silently disabled, which is how 1.2.3 went out.
      - name: Check crash reporting is configured
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        # `env:exec` runs this through `sh`, so keep it POSIX.
        run: |
          npx eas-cli@20 env:exec production '
            if [ -z "$EXPO_PUBLIC_SENTRY_DSN" ]; then
              echo "::error::EXPO_PUBLIC_SENTRY_DSN is not readable in the production environment. It must have plain-text visibility; local builds cannot read secret variables."
              exit 1
            fi
            if [ -z "$SENTRY_AUTH_TOKEN" ]; then
              echo "::error::SENTRY_AUTH_TOKEN is not readable in the production environment. Source maps would upload unsymbolicated."
              exit 1
            fi
            echo "Crash reporting is configured."
          '

      - name: Install local Android credentials
        run: |
          if [[ -f apps/mobile/credentials.json ]]; then
            exit 0
          fi

          CREDENTIALS_DIR="${OVERTCHAT_MOBILE_CREDENTIALS_DIR:-$HOME/.overtchat/mobile-credentials}"
          cp "$CREDENTIALS_DIR/credentials.json" apps/mobile/credentials.json
          cp -R "$CREDENTIALS_DIR/credentials" apps/mobile/credentials

      - name: Build AAB locally
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          mkdir -p ../../dist/mobile
          npx eas-cli@20 build --local --non-interactive \
            --platform android --profile production \
            --output "../../dist/mobile/overtchat-v${{ steps.version.outputs.version }}.aab"

      - name: Build APK locally
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          mkdir -p ../../dist/mobile
          npx eas-cli@20 build --local --non-interactive \
            --platform android --profile production-apk \
            --output "../../dist/mobile/overtchat-v${{ steps.version.outputs.version }}.apk"

      - name: Upload signed Android artifacts
        uses: actions/upload-artifact@v7
        with:
          name: overtchat-mobile-${{ steps.version.outputs.version }}
          path: |
            dist/mobile/overtchat-v${{ steps.version.outputs.version }}.aab
            dist/mobile/overtchat-v${{ steps.version.outputs.version }}.apk
          if-no-files-found: error
          overwrite: true
          retention-days: 3

  smoke-android:
    needs: build-android
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6

      - name: Download signed Android artifacts
        uses: actions/download-artifact@v8
        with:
          name: overtchat-mobile-${{ needs.build-android.outputs.version }}
          path: dist/mobile

      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Smoke-test production APK
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_7_pro
          disable-animations: true
          script: >-
            bash .github/scripts/android-release-smoke.sh
            "dist/mobile/overtchat-v${{ needs.build-android.outputs.version }}.apk"
            "dist/mobile/smoke-diagnostics"

      - name: Upload smoke-test diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: overtchat-mobile-smoke-diagnostics-${{ needs.build-android.outputs.version }}
          path: dist/mobile/smoke-diagnostics/
          if-no-files-found: warn
          retention-days: 14

  publish-android:
    if: startsWith(github.ref, 'refs/tags/mobile-v')
    needs: [build-android, smoke-android]
    runs-on: self-hosted
    permissions:
      contents: write
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Download verified Android artifacts
        uses: actions/download-artifact@v8
        with:
          name: overtchat-mobile-${{ needs.build-android.outputs.version }}
          path: dist/mobile

      - name: Submit AAB to Play
        working-directory: apps/mobile
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
        run: |
          npx eas-cli@20 submit --non-interactive \
            --platform android --profile production \
            --path "../../dist/mobile/overtchat-v${{ needs.build-android.outputs.version }}.aab"

      - name: Attach APK to GitHub release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ needs.build-android.outputs.expected_tag }}"
          APK="dist/mobile/overtchat-v${{ needs.build-android.outputs.version }}.apk"

          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --draft --title "$TAG" --notes "Draft - fill in notes before publishing."
          gh release upload "$TAG" "$APK" --clobber
