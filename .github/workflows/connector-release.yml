name: Build and publish Host Connector

on:
  push:
    tags: ["connector-v*"]
  pull_request:
    paths:
      - ".github/workflows/connector-release.yml"
      - "apps/connector/**"
      - "packages/agent-bridge/**"
      - "packages/agent-runtime/**"
      - "package.json"
      - "package-lock.json"
      - "scripts/install-connector.sh"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing connector-v* release tag to publish into
        required: true
        type: string

permissions: {}

concurrency:
  group: connector-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    outputs:
      version: ${{ steps.version.outputs.version }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - uses: actions/setup-node@v6
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Use pinned npm
        run: npm install --global npm@10.9.8

      - run: npm ci

      - name: Validate connector release version
        id: version
        run: |
          version=$(node -p "require('./apps/connector/package.json').version")
          grep -F "connector_version=\"$version\"" scripts/install-connector.sh
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Build Linux binaries
        run: |
          mkdir -p dist/connector-release
          bun build apps/connector/src/cli.ts \
            --compile \
            --target=bun-linux-x64-baseline \
            --outfile dist/connector-release/overtchat-connector-linux-amd64
          bun build apps/connector/src/cli.ts \
            --compile \
            --target=bun-linux-arm64 \
            --outfile dist/connector-release/overtchat-connector-linux-arm64
          cp scripts/install-connector.sh dist/connector-release/
          (
            cd dist/connector-release
            sha256sum \
              overtchat-connector-linux-amd64 \
              overtchat-connector-linux-arm64 \
              > connector-checksums.txt
          )

      - uses: actions/upload-artifact@v7
        with:
          name: host-connector-release
          path: dist/connector-release/
          if-no-files-found: error
          retention-days: 7

  publish:
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: host-connector-release
          path: release

      - name: Validate release tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag || github.ref_name }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          test "$TAG" = "connector-v$VERSION"

      - name: Create or resume draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag || github.ref_name }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          if gh release view "$TAG" --json isDraft --jq '.isDraft' > release-draft; then
            test "$(cat release-draft)" = "true" || {
              echo "Release $TAG is already published and immutable." >&2
              exit 1
            }
          else
            gh release create "$TAG" \
              --draft \
              --title "OvertChat Host Connector v$VERSION" \
              --generate-notes \
              --latest=false \
              --verify-tag
          fi

      - name: Upload assets to draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          test "$(gh release view "$TAG" --json isDraft --jq '.isDraft')" = "true"
          gh release upload "$TAG" release/* --clobber

      - name: Verify draft release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          test "$(gh release view "$TAG" --json isDraft --jq '.isDraft')" = "true"

          expected_assets=$(printf '%s\n' \
            connector-checksums.txt \
            install-connector.sh \
            overtchat-connector-linux-amd64 \
            overtchat-connector-linux-arm64)
          actual_assets=$(gh release view "$TAG" --json assets --jq '.assets[].name' | LC_ALL=C sort)
          test "$actual_assets" = "$expected_assets"

          verification_directory=$(mktemp -d)
          trap 'rm -rf "$verification_directory"' EXIT HUP INT TERM
          gh release download "$TAG" --dir "$verification_directory" \
            --pattern connector-checksums.txt \
            --pattern install-connector.sh \
            --pattern overtchat-connector-linux-amd64 \
            --pattern overtchat-connector-linux-arm64

          for asset in \
            connector-checksums.txt \
            install-connector.sh \
            overtchat-connector-linux-amd64 \
            overtchat-connector-linux-arm64; do
            cmp "release/$asset" "$verification_directory/$asset"
          done
          (cd "$verification_directory" && sha256sum --check connector-checksums.txt)

      - name: Publish verified release without changing Latest
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          test "$(gh release view "$TAG" --json isDraft --jq '.isDraft')" = "true"
          gh release edit "$TAG" --draft=false --latest=false
