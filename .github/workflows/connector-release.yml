name: Build and publish Host Connector

on:
  push:
    tags: ["connector-v*"]
  pull_request:
    paths:
      - ".github/workflows/connector-release.yml"
      - ".github/scripts/smoke-connector-journal.mjs"
      - ".github/scripts/smoke-connector-service-windows.ps1"
      - "apps/connector/**"
      - "packages/agent-bridge/**"
      - "packages/agent-runtime/**"
      - "packages/shared/**"
      - "package.json"
      - "package-lock.json"
      - "scripts/install-connector.sh"
  workflow_dispatch:
    inputs:
      tag:
        description: Existing connector-v* release tag to publish into
        required: true
        type: string

permissions: {}

concurrency:
  group: connector-release-${{ inputs.tag || github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    outputs:
      version: ${{ steps.version.outputs.version }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Use pinned npm
        run: npm install --global npm@10.9.8

      - run: npm ci

      - name: Validate connector release version
        id: version
        run: |
          version=$(node -p "require('./apps/connector/package.json').version")
          grep -F "connector_version=\"$version\"" scripts/install-connector.sh
          test "$(node -p "require('./apps/site/public/install-manifest.json').connectorVersion")" = \
            "$version"
          installer_url="https://github.com/${{ github.repository }}/releases/download/connector-v$version/install-connector.sh"
          grep -Fx "/install/connector/$version $installer_url 302" apps/site/public/_redirects
          grep -Fx "/install-connector.sh /install/connector/$version 302" \
            apps/site/public/_redirects
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Package Linux, macOS, and Windows runtimes
        run: |
          mkdir -p dist/connector-release dist/connector-journal-smoke
          for target in linux-x64 linux-arm64 darwin-x64 darwin-arm64 win32-x64; do
            npm run build:package -w apps/connector -- --target "$target" --output "$PWD/dist/connector-release"
          done
          cat dist/connector-release/*.sha256 > dist/connector-release/connector-checksums.txt
          rm dist/connector-release/*.sha256
          cp scripts/install-connector.sh dist/connector-release/
          npx esbuild apps/connector/src/test-support/journal-runtime-smoke.ts \
            apps/connector/src/test-support/journal-crash-worker.ts \
            --bundle --platform=node --target=node22 --format=esm \
            --banner:js="import { createRequire as __overtchatCreateRequire } from 'node:module'; const require = __overtchatCreateRequire(import.meta.url);" \
            --out-extension:.js=.mjs --outdir=dist/connector-journal-smoke

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: host-connector-release
          path: dist/connector-release/
          if-no-files-found: error
          retention-days: 7

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: host-connector-journal-smoke
          path: dist/connector-journal-smoke/
          if-no-files-found: error
          retention-days: 7

  smoke:
    needs: build
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux-amd64
          - runner: ubuntu-24.04-arm
            platform: linux-arm64
          - runner: macos-15-intel
            platform: darwin-amd64
          - runner: macos-15
            platform: darwin-arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.x
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: host-connector-release
          path: release
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: host-connector-journal-smoke
          path: journal-smoke
      - name: Run the packaged runtime on its target OS and CPU
        env:
          PLATFORM: ${{ matrix.platform }}
          VERSION: ${{ needs.build.outputs.version }}
          SHELL: /bin/sh
        run: |
          tar -xzf "release/overtchat-connector-$PLATFORM.tar.gz" -C release
          connector="$PWD/release/overtchat-connector/overtchat-connector"
          runtime="$PWD/release/overtchat-connector/bin/node"
          test "$(env PATH=/usr/bin:/bin "$connector" version)" = "$VERSION"
          env PATH=/usr/bin:/bin "$connector" terminal-smoke --output-bytes 16777216
          "$runtime" .github/scripts/smoke-connector-journal.mjs \
            "$connector" journal-smoke/journal-crash-worker.mjs "$runtime"
          "$runtime" --max-old-space-size=256 journal-smoke/journal-runtime-smoke.mjs --scale

  smoke-windows:
    needs: build
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.x
          cache: npm
      - run: npm install --global npm@10.9.8
      - run: npm ci
      - run: npm run typecheck -w apps/connector
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: host-connector-release
          path: release
      - name: Run the packaged runtime on Windows
        shell: pwsh
        env:
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          tar -xzf release/overtchat-connector-windows-amd64.tar.gz -C release
          if ($LASTEXITCODE -ne 0) { throw 'Windows package extraction failed' }
          $runtime = "$PWD/release/overtchat-connector/bin/node.exe"
          $entry = "$PWD/release/overtchat-connector/app/connector.mjs"
          # Exclude the runner's Node so only the bundled runtime can satisfy these checks.
          $env:Path = "$env:SystemRoot\System32;$env:SystemRoot;$env:SystemRoot\System32\WindowsPowerShell\v1.0"
          $actual = & ./release/overtchat-connector/overtchat-connector.cmd version
          if ($LASTEXITCODE -ne 0 -or $actual -ne $env:VERSION) { throw 'Windows launcher version check failed' }
          & $runtime $entry terminal-smoke --output-bytes 16777216
          if ($LASTEXITCODE -ne 0) { throw 'Windows terminal smoke failed' }
      # These suites perform real durable disk writes and compile native
      # PowerShell helpers. Avoid competing cold starts on hosted Windows.
      - run: npm run test -w apps/connector -- --no-file-parallelism src/windows-service.test.ts src/host-environment.test.ts src/windows-helper.test.ts src/windows-input.test.ts src/service-logging.test.ts src/journal-sqlite.test.ts src/state.test.ts src/timeline.test.ts src/client.test.ts src/config-persistence.test.ts
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: host-connector-journal-smoke
          path: journal-smoke
      - name: Exercise packaged journal migration and crash recovery on NTFS
        run: |
          $runtime = "release/overtchat-connector/bin/node.exe"
          & $runtime .github/scripts/smoke-connector-journal.mjs release/overtchat-connector/app/connector.mjs journal-smoke/journal-crash-worker.mjs $runtime
          if ($LASTEXITCODE -ne 0) { throw 'Windows journal crash smoke failed' }
          & $runtime --max-old-space-size=256 journal-smoke/journal-runtime-smoke.mjs --scale
          if ($LASTEXITCODE -ne 0) { throw 'Windows journal scale smoke failed' }
      # Interactive-token Task Scheduler lifecycle runs on a logged-in physical
      # Windows host; GitHub's service-session runner cannot prove that contract.

  publish:
    if: github.event_name != 'pull_request'
    needs: [build, smoke, smoke-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: host-connector-release
          path: release

      - name: Validate release tag
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag || github.ref_name }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          test "$TAG" = "connector-v$VERSION"

      - name: Create or resume draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag || github.ref_name }}
          VERSION: ${{ needs.build.outputs.version }}
        run: |
          if gh release view "$TAG" --json isDraft --jq '.isDraft' > release-draft; then
            test "$(cat release-draft)" = "true" || {
              echo "Release $TAG is already published and immutable." >&2
              exit 1
            }
          else
            gh release create "$TAG" \
              --draft \
              --title "OvertChat Host Connector v$VERSION" \
              --generate-notes \
              --latest=false \
              --verify-tag
          fi

      - name: Upload assets to draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          test "$(gh release view "$TAG" --json isDraft --jq '.isDraft')" = "true"
          gh release upload "$TAG" release/* --clobber

      - name: Verify draft release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          test "$(gh release view "$TAG" --json isDraft --jq '.isDraft')" = "true"

          expected_assets=$(printf '%s\n' \
            connector-checksums.txt \
            install-connector.sh \
            overtchat-connector-darwin-amd64.tar.gz \
            overtchat-connector-darwin-arm64.tar.gz \
            overtchat-connector-linux-amd64.tar.gz \
            overtchat-connector-linux-arm64.tar.gz \
            overtchat-connector-windows-amd64.tar.gz)
          actual_assets=$(gh release view "$TAG" --json assets --jq '.assets[].name' | LC_ALL=C sort)
          test "$actual_assets" = "$expected_assets"

          verification_directory=$(mktemp -d)
          trap 'rm -rf "$verification_directory"' EXIT HUP INT TERM
          gh release download "$TAG" --dir "$verification_directory" \
            --pattern connector-checksums.txt \
            --pattern install-connector.sh \
            --pattern overtchat-connector-darwin-amd64.tar.gz \
            --pattern overtchat-connector-darwin-arm64.tar.gz \
            --pattern overtchat-connector-linux-amd64.tar.gz \
            --pattern overtchat-connector-linux-arm64.tar.gz \
            --pattern overtchat-connector-windows-amd64.tar.gz

          for asset in \
            connector-checksums.txt \
            install-connector.sh \
            overtchat-connector-darwin-amd64.tar.gz \
            overtchat-connector-darwin-arm64.tar.gz \
            overtchat-connector-linux-amd64.tar.gz \
            overtchat-connector-linux-arm64.tar.gz \
            overtchat-connector-windows-amd64.tar.gz; do
            cmp "release/$asset" "$verification_directory/$asset"
          done
          (cd "$verification_directory" && sha256sum --check connector-checksums.txt)

      - name: Publish verified release without changing Latest
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          test "$(gh release view "$TAG" --json isDraft --jq '.isDraft')" = "true"
          gh release edit "$TAG" --draft=false --latest=false

  deploy-site:
    if: github.event_name != 'pull_request'
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - name: Promote release after the connector is public
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: >-
          gh workflow run promote-release.yml --ref main
          -f require_complete=false
