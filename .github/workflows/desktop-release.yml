name: Build desktop app

on:
  pull_request:
    paths:
      - ".github/workflows/desktop-release.yml"
      - ".github/workflows/desktop-update-feed.yml"
      - ".github/scripts/*desktop-mac*"
      - ".github/scripts/*desktop-linux*"
      - ".github/scripts/*desktop-update*"
      - "apps/desktop/**"
      - "apps/web/**"
      - "packages/shared/**"
      - "package.json"
      - "package-lock.json"
  push:
    tags: ["desktop-v*"]
  workflow_dispatch:
    inputs:
      qualification_baseline_run:
        description: Private loopback baseline build run ID (qualification only)
        required: false
        type: string
      qualification_candidate_run:
        description: Exact candidate build run ID (skips rebuilding; requires baseline)
        required: false
        type: string

permissions: {}

concurrency:
  group: desktop-release-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    if: '!inputs.qualification_candidate_run'
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
            app-directory: mac-arm64
          - runner: macos-15-intel
            arch: x64
            app-directory: mac
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Use pinned npm
        run: npm install --global npm@10.9.8
      - run: npm ci
      - name: Validate desktop version and release tag
        env:
          RELEASE_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '' }}
        run: |
          node --input-type=module <<'JS'
          import assert from 'node:assert/strict';
          import { readFileSync } from 'node:fs';
          const version = JSON.parse(readFileSync('apps/desktop/package.json')).version;
          assert(/^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/.test(version), 'Expected strict X.Y.Z desktop version');
          if (process.env.RELEASE_TAG) assert.equal(process.env.RELEASE_TAG, `desktop-v${version}`);
          JS
      - run: npm run typecheck -w apps/desktop --
      - run: npm run test -w apps/desktop --
      - run: node --test .github/scripts/desktop-update-metadata.test.mjs .github/scripts/publish-desktop-updates.test.mjs
      - name: Package without release credentials for PR validation
        if: github.event_name == 'pull_request'
        env:
          ARCH: ${{ matrix.arch }}
          # Builder skips even ad-hoc signatures in PRs by default. This step
          # explicitly uses identity "-" and receives no release credentials.
          CSC_FOR_PULL_REQUEST: "true"
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm run package:mac -w apps/desktop -- "--$ARCH"
      - name: Verify PR bundle
        if: github.event_name == 'pull_request'
        env:
          APP_DIRECTORY: ${{ matrix.app-directory }}
          ARCH: ${{ matrix.arch }}
        run: node .github/scripts/verify-desktop-mac.mjs "apps/desktop/release/$APP_DIRECTORY/overtchat.app" "$ARCH" adhoc
      - name: Sign, notarize, and verify downloadable artifacts
        if: github.event_name != 'pull_request'
        env:
          ARCH: ${{ matrix.arch }}
          MACOS_DEVELOPER_ID_P12: ${{ secrets.MACOS_DEVELOPER_ID_P12 }}
          MACOS_DEVELOPER_ID_PASSWORD: ${{ secrets.MACOS_DEVELOPER_ID_PASSWORD }}
          ASC_API_KEY_ID: ${{ secrets.ASC_API_KEY_ID }}
          ASC_API_ISSUER_ID: ${{ secrets.ASC_API_ISSUER_ID }}
          ASC_API_PRIVATE_KEY: ${{ secrets.ASC_API_PRIVATE_KEY }}
        run: bash .github/scripts/package-desktop-mac.sh "$ARCH"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: github.event_name != 'pull_request'
        with:
          name: desktop-mac-${{ matrix.arch }}
          path: |
            apps/desktop/release/overtchat-*-mac-${{ matrix.arch }}.dmg
            apps/desktop/release/overtchat-*-mac-${{ matrix.arch }}.zip
            apps/desktop/release/desktop-checksums-${{ matrix.arch }}.txt
            apps/desktop/release/stable-${{ matrix.arch }}-mac.yml
          if-no-files-found: error
          retention-days: 7

  build-linux:
    if: '!inputs.qualification_candidate_run'
    permissions:
      contents: read
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Use pinned npm
        run: npm install --global npm@10.9.8
      - run: npm ci
      - name: Install Linux packaging and smoke dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y binutils rpm cpio desktop-file-utils xvfb xauth dbus-x11 gnome-keyring libsecret-tools libgtk-3-0 libnss3 libasound2 libgbm1
      - run: npm run typecheck -w apps/desktop --
      - run: npm run test -w apps/desktop --
      - name: Package and verify every Linux download
        run: bash .github/scripts/package-desktop-linux.sh
      - name: Install and smoke test the Debian package
        env:
          DESKTOP_SMOKE_ARTIFACT_DIR: ${{ runner.temp }}/desktop-smoke
        run: |
          sudo apt-get install -y ./apps/desktop/release/overtchat-*-linux-x64.deb
          test "$(stat -c '%u:%a' /opt/overtchat/chrome-sandbox)" = 0:4755
          # Same code with a higher package version tests first-release upgrades
          # without changing the candidate downloads or the source version.
          upgrade_version=$(node -p 'const v=require("./apps/desktop/package.json").version.split(".").map(Number); v[2]++; v.join(".")')
          node node_modules/electron-builder/out/cli/cli.js --projectDir apps/desktop --config electron-builder.linux.yml --linux deb --x64 --publish never \
            --config.extraMetadata.version="$upgrade_version" --config.directories.output="$RUNNER_TEMP/desktop-upgrade"
          export UPGRADE_DEB="$RUNNER_TEMP/desktop-upgrade/overtchat-$upgrade_version-linux-x64.deb"
          test "$(dpkg-deb --field "$UPGRADE_DEB" Version)" = "$upgrade_version"
          xvfb-run -a dbus-run-session -- bash <<'SH'
          set -euo pipefail
          printf '%s' 'test-only-keyring-password' | gnome-keyring-daemon --unlock --components=secrets
          DESKTOP_SMOKE_UPGRADE_DEB="$UPGRADE_DEB" node .github/scripts/smoke-desktop-linux.mjs /usr/bin/overtchat-desktop persistent
          node .github/scripts/smoke-desktop-linux.mjs /usr/bin/overtchat-desktop session
          node .github/scripts/smoke-desktop-local-discovery.mjs /usr/bin/overtchat-desktop
          SH
          sudo apt-get remove -y overtchat-desktop
          test ! -e /usr/bin/overtchat-desktop
          test ! -e /etc/apparmor.d/overtchat-desktop
      - name: Verify Fedora RPM installation and removal
        run: |
          docker run --rm --volume "$PWD/apps/desktop/release:/artifacts:ro" fedora:44 bash -euo pipefail -c '
            dnf install -y desktop-file-utils /artifacts/overtchat-*-linux-x64.rpm
            test "$(stat -c "%u:%a" /opt/overtchat/chrome-sandbox)" = 0:4755
            test -x /usr/bin/overtchat-desktop
            desktop-file-validate /usr/share/applications/com.overtchat.desktop.desktop
            dnf remove -y overtchat-desktop
            test ! -e /usr/bin/overtchat-desktop
          '
      - name: Smoke test portable formats with the kernel sandbox
        env:
          DESKTOP_SMOKE_ARTIFACT_DIR: ${{ runner.temp }}/desktop-smoke-portable
        run: |
          unshare --user --map-root-user --net true
          portable=$(mktemp -d)
          trap 'rm -rf "$portable"' EXIT
          appimages=("$GITHUB_WORKSPACE"/apps/desktop/release/overtchat-linux-x64.AppImage)
          test "${#appimages[@]}" = 1
          (cd "$portable" && "${appimages[0]}" --appimage-extract >/dev/null)
          DESKTOP_SMOKE_ARTIFACT_DIR="$DESKTOP_SMOKE_ARTIFACT_DIR/appimage" xvfb-run -a dbus-run-session -- node .github/scripts/smoke-desktop-linux.mjs "$portable/squashfs-root/AppRun" session
          APPIMAGE_EXTRACT_AND_RUN=1 DESKTOP_SMOKE_ARTIFACT_DIR="$DESKTOP_SMOKE_ARTIFACT_DIR/appimage-runtime" xvfb-run -a dbus-run-session -- node .github/scripts/smoke-desktop-linux.mjs "${appimages[0]}" session
          mkdir "$portable/tar"
          tar -xzf apps/desktop/release/overtchat-*-linux-x64.tar.gz -C "$portable/tar"
          executable=$(find "$portable/tar" -maxdepth 2 -type f -name overtchat-desktop)
          test -n "$executable"
          DESKTOP_SMOKE_ARTIFACT_DIR="$DESKTOP_SMOKE_ARTIFACT_DIR/tar" xvfb-run -a dbus-run-session -- node .github/scripts/smoke-desktop-linux.mjs "$executable" session
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: desktop-smoke-linux-x64
          path: ${{ runner.temp }}/desktop-smoke*
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: desktop-linux-x64
          path: |
            apps/desktop/release/overtchat-linux-x64.AppImage
            apps/desktop/release/overtchat-*-linux-x64.deb
            apps/desktop/release/overtchat-*-linux-x64.rpm
            apps/desktop/release/overtchat-*-linux-x64.tar.gz
            apps/desktop/release/desktop-checksums-linux-x64.txt
            apps/desktop/release/stable-linux.yml
          if-no-files-found: error
          retention-days: 7

  smoke-linux-ubuntu24:
    needs: build-linux
    permissions:
      contents: read
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Use pinned npm
        run: npm install --global npm@10.9.8
      - run: npm ci
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: desktop-linux-x64
          path: release
      - name: Install and smoke test the Debian package on Ubuntu 24.04
        env:
          DESKTOP_SMOKE_ARTIFACT_DIR: ${{ runner.temp }}/desktop-smoke
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb xauth dbus-x11 gnome-keyring libsecret-tools ./release/overtchat-*-linux-x64.deb
          test "$(stat -c '%u:%a' /opt/overtchat/chrome-sandbox)" = 0:4755
          xvfb-run -a dbus-run-session -- bash <<'SH'
          set -euo pipefail
          printf '%s' 'test-only-keyring-password' | gnome-keyring-daemon --unlock --components=secrets
          node .github/scripts/smoke-desktop-linux.mjs /usr/bin/overtchat-desktop persistent
          node .github/scripts/smoke-desktop-linux.mjs /usr/bin/overtchat-desktop session
          node .github/scripts/smoke-desktop-local-discovery.mjs /usr/bin/overtchat-desktop
          SH
          sudo apt-get remove -y overtchat-desktop
          test ! -e /usr/bin/overtchat-desktop
          test ! -e /etc/apparmor.d/overtchat-desktop
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: desktop-smoke-linux-ubuntu24
          path: ${{ runner.temp }}/desktop-smoke
          if-no-files-found: ignore
          retention-days: 7

  qualify-mac:
    if: github.event_name == 'workflow_dispatch' && inputs.qualification_candidate_run
    permissions:
      contents: read
      actions: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-15
            arch: arm64
          - runner: macos-15-intel
            arch: x64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.x
          cache: npm
      - run: npm install --global npm@10.9.8
      - run: npm ci
      - name: Download exact signed baseline and candidate
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BASELINE_RUN: ${{ inputs.qualification_baseline_run }}
          CANDIDATE_RUN: ${{ inputs.qualification_candidate_run }}
          ARCH: ${{ matrix.arch }}
        run: |
          [[ "$BASELINE_RUN" =~ ^[0-9]+$ && "$CANDIDATE_RUN" =~ ^[0-9]+$ ]]
          gh run download "$BASELINE_RUN" --name "desktop-mac-$ARCH" --dir baseline
          gh run download "$CANDIDATE_RUN" --name "desktop-mac-$ARCH" --dir candidate
          (cd baseline && shasum -a 256 --check "desktop-checksums-$ARCH.txt")
          (cd candidate && shasum -a 256 --check "desktop-checksums-$ARCH.txt")
          ditto -x -k baseline/overtchat-*-mac-"$ARCH".zip baseline/app
          node .github/scripts/verify-desktop-mac.mjs baseline/app/overtchat.app "$ARCH" notarized 0.1.0
      - name: Qualify real update and saved login
        shell: bash
        run: |
          keychain="$RUNNER_TEMP/overtchat-upgrade.keychain-db"
          password="$(openssl rand -base64 32)"
          original_default="$(security default-keychain -d user | sed -E 's/^ *"//; s/"$//')"
          original_list=()
          while IFS= read -r item; do original_list+=("$item"); done < <(security list-keychains -d user | sed -E 's/^ *"//; s/"$//')
          cleanup() {
            security default-keychain -d user -s "$original_default"
            security list-keychains -d user -s "${original_list[@]}"
            security delete-keychain "$keychain"
          }
          trap cleanup EXIT
          security create-keychain -p "$password" "$keychain"
          security unlock-keychain -p "$password" "$keychain"
          security set-keychain-settings -lut 1200 "$keychain"
          security default-keychain -d user -s "$keychain"
          security list-keychains -d user -s "$keychain"
          security add-generic-password -a overtchat -s "overtchat Safe Storage" -w "$(openssl rand -base64 32)" -T "$GITHUB_WORKSPACE/baseline/app/overtchat.app/Contents/MacOS/overtchat" "$keychain"
          node .github/scripts/qualify-desktop-update.mjs baseline/app/overtchat.app/Contents/MacOS/overtchat candidate "$(node -p 'require("./apps/desktop/package.json").version')"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: desktop-update-qualification-${{ matrix.arch }}
          path: ${{ runner.temp }}/overtchat-update-qualification-*/qualification.log
          if-no-files-found: ignore
          retention-days: 7

  draft-release:
    if: github.event_name == 'push'
    needs: [build, build-linux, smoke-linux-ubuntu24]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: desktop-mac-*
          merge-multiple: true
          path: release
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: desktop-linux-x64
          path: release
      - name: Create or resume a verified draft release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
        run: |
          version="${TAG#desktop-v}"
          expected=$(printf '%s\n' \
            desktop-checksums-arm64.txt desktop-checksums-x64.txt desktop-checksums-linux-x64.txt \
            stable-arm64-mac.yml stable-x64-mac.yml stable-linux.yml \
            "overtchat-$version-mac-arm64.dmg" "overtchat-$version-mac-arm64.zip" \
            "overtchat-$version-mac-x64.dmg" "overtchat-$version-mac-x64.zip" \
            overtchat-linux-x64.AppImage "overtchat-$version-linux-x64.deb" \
            "overtchat-$version-linux-x64.rpm" "overtchat-$version-linux-x64.tar.gz" | LC_ALL=C sort)
          actual=$(find release -maxdepth 1 -type f -printf '%f\n' | LC_ALL=C sort)
          test "$actual" = "$expected"
          (cd release && sha256sum --check desktop-checksums-arm64.txt && sha256sum --check desktop-checksums-x64.txt && sha256sum --check desktop-checksums-linux-x64.txt)

          if gh release view "$TAG" --json isDraft --jq '.isDraft' > release-draft; then
            test "$(cat release-draft)" = true || {
              echo "Release $TAG is already public and immutable." >&2
              exit 1
            }
          else
            gh release create "$TAG" --draft --verify-tag --latest=false \
              --title "OvertChat Desktop v$version" --generate-notes
          fi
          test "$(gh release view "$TAG" --json isDraft --jq '.isDraft')" = true
          gh release upload "$TAG" release/* --clobber
          actual=$(gh release view "$TAG" --json assets --jq '.assets[].name' | LC_ALL=C sort)
          test "$actual" = "$expected"
          verification_directory=$(mktemp -d)
          trap 'rm -rf "$verification_directory"' EXIT
          gh release download "$TAG" --dir "$verification_directory"
          for asset in release/*; do
            cmp "$asset" "$verification_directory/$(basename "$asset")"
          done
          (cd "$verification_directory" && sha256sum --check desktop-checksums-arm64.txt && sha256sum --check desktop-checksums-x64.txt && sha256sum --check desktop-checksums-linux-x64.txt)
          echo 'Verified draft ready. Complete the desktop install, restart, and upgrade checks in docs/release.md before publishing.' >> "$GITHUB_STEP_SUMMARY"
