name: Web E2E Smoke

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Chromium and its system libraries come preinstalled, so the job installs
    # only the tools the tests add, as the image's default root user. Keep the
    # tag on the lockfile's Playwright version.
    container:
      image: mcr.microsoft.com/playwright:v1.60.0-noble
      options: --init --ipc=host
    services:
      redis:
        image: redis:8-alpine@sha256:d146f83b1e0f02fc27c26a50cee39338c736674c5959db84363e6ae3cd9e02d2
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 3s
          --health-retries 5
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      # The workspace terminal test edits a file with vi.
      - name: Install vi
        timeout-minutes: 2
        run: |
          install -m 644 .github/apt-ci.conf /etc/apt/apt.conf.d/99overtchat-ci
          apt-get update
          apt-get install --yes --no-install-recommends vim-tiny
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - name: Check the image's browser matches Playwright
        run: |
          node -e "require('node:fs').accessSync(require('playwright-core').chromium.executablePath())" || {
            echo "::error::Set the container image to mcr.microsoft.com/playwright:v$(node -p "require('playwright-core/package.json').version")-noble"
            exit 1
          }
      - env:
          DATABASE_URL: ":memory:"
          BETTER_AUTH_SECRET: ci-build-secret-12345678901234567890
          BETTER_AUTH_URL: http://localhost:4717
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run build -w apps/web --
      - env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CI: true
          REDIS_URL: redis://redis:6379
        run: npm run test:e2e -w apps/web --
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        timeout-minutes: 2
        with:
          name: playwright-report
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          if-no-files-found: ignore
          retention-days: 30
