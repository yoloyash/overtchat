name: Web E2E Smoke

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      redis:
        image: redis:8-alpine@sha256:d146f83b1e0f02fc27c26a50cee39338c736674c5959db84363e6ae3cd9e02d2
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 3s
          --health-retries 5
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22.x
          cache: npm
          cache-dependency-path: package-lock.json
      - run: npm ci
      - run: npx playwright install chromium --with-deps
      - env:
          DATABASE_URL: ":memory:"
          BETTER_AUTH_SECRET: ci-build-secret-12345678901234567890
          BETTER_AUTH_URL: http://localhost:4717
          NEXT_TELEMETRY_DISABLED: "1"
        run: npm run build -w apps/web --
      - env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          CI: true
          REDIS_URL: redis://127.0.0.1:6379
        run: npm run test:e2e -w apps/web --
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 30
