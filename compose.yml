services:
  app:
    image: ghcr.io/yoloyash/overtchat-app:${APP_VERSION:-0.28.1}
    build: .
    container_name: overtchat-app
    restart: unless-stopped
    ports:
      - "${APP_BIND_ADDRESS:-0.0.0.0}:${APP_PORT:-4718}:4717"
    environment:
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?set BETTER_AUTH_SECRET in .env}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:-http://localhost:4718}
      EXTRA_TRUSTED_ORIGINS: ${EXTRA_TRUSTED_ORIGINS:-}
      DISABLE_UPDATE_CHECK: ${DISABLE_UPDATE_CHECK:-false}
      OVERTCHAT_REQUIRE_ADMIN_TWO_FACTOR: ${OVERTCHAT_REQUIRE_ADMIN_TWO_FACTOR:-false}
      HOST_CONNECTOR_URL: ${HOST_CONNECTOR_URL:-http://127.0.0.1:${APP_PORT:-4718}}
      OVERTCHAT_INSTALLED_CAPABILITIES: ${OVERTCHAT_INSTALLED_CAPABILITIES:-search,tts,stt}
      VOICE_SHARED_SECRET: ${VOICE_SHARED_SECRET:-}
      SEARXNG_URL: ${OVERTCHAT_SEARXNG_URL:-http://searxng:8080}
      KOKORO_URL: ${OVERTCHAT_KOKORO_URL:-http://kokoro:8880}
      STT_URL: ${OVERTCHAT_STT_URL:-http://stt:5092}
      SANDBOX_URL: ${OVERTCHAT_SANDBOX_URL:-}
      SANDBOX_TOKEN: ${SANDBOX_TOKEN:-}
      DATABASE_URL: /app/data/chat.db
      REDIS_URL: redis://redis:6379
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks: [default, sandbox]
    volumes:
      - overtchat-data:/app/data
      - overtchat-npm-cache:/app/npm-cache
    depends_on:
      searxng:
        condition: service_healthy
        required: false
      kokoro:
        condition: service_healthy
        required: false
      redis:
        condition: service_healthy

  voice:
    image: ghcr.io/yoloyash/overtchat-voice:${VOICE_VERSION:-0.1.3}
    build: ./voice
    container_name: overtchat-voice
    restart: unless-stopped
    profiles: [voice]
    environment:
      VOICE_SHARED_SECRET: ${VOICE_SHARED_SECRET:-}
    depends_on:
      app:
        condition: service_started

  redis:
    image: docker.io/library/redis@sha256:d146f83b1e0f02fc27c26a50cee39338c736674c5959db84363e6ae3cd9e02d2
    container_name: overtchat-redis
    restart: unless-stopped
    command:
      - redis-server
      - --save
      - ""
      - --appendonly
      - "no"
      - --maxmemory
      - 64mb
      - --maxmemory-policy
      - allkeys-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5

  searxng:
    # SearXNG engines churn often; latest avoids silently losing search coverage.
    image: docker.io/searxng/searxng@sha256:11a9b34cdc0b1ec2b991470a2762ecb5a1a531898289fb51dcd015260450729e
    container_name: overtchat-searxng
    restart: unless-stopped
    environment:
      FORCE_OWNERSHIP: "false"
      SEARXNG_SECRET: ${SEARXNG_SECRET:?set SEARXNG_SECRET in .env}
    volumes:
      - ./searxng:/etc/searxng:rw
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://localhost:8080/healthz || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 10
      start_period: 10s

  # Text-to-speech via Kokoro. The source stack keeps its existing CPU default;
  # the managed installer owns accelerator selection.
  kokoro:
    image: ghcr.io/remsky/kokoro-fastapi-cpu@sha256:28d6f0b6e4df369559012578299d201b855a08fac466f616653edd1f08c5370a
    container_name: overtchat-kokoro
    restart: unless-stopped
    labels:
      com.overtchat.tts.accelerator: cpu
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8880/health').status==200 else 1)\""]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s

  # Speech-to-text via Parakeet TDT v3. Off by default; opt in with:
  #   docker compose --profile stt up -d        (CPU, ~670MB model, ~2GB RAM)
  #   docker compose --profile stt-gpu up -d    (NVIDIA GPU, requires NVIDIA Container Toolkit)
  # Both services are reachable from `app` as `http://stt:5092`.
  stt-cpu:
    image: ghcr.io/yoloyash/overtchat-stt-cpu:${STT_VERSION:-0.1.1}
    build:
      context: ./speech/stt
      dockerfile: Dockerfile.cpu
    container_name: overtchat-stt-cpu
    restart: unless-stopped
    profiles: [stt]
    networks:
      default:
        aliases: [stt]
    volumes:
      - overtchat-stt-models:/models

  stt-gpu:
    image: ghcr.io/yoloyash/overtchat-stt-gpu:${STT_VERSION:-0.1.1}
    build:
      context: ./speech/stt
      dockerfile: Dockerfile.gpu
    container_name: overtchat-stt-gpu
    restart: unless-stopped
    profiles: [stt-gpu]
    networks:
      default:
        aliases: [stt]
    volumes:
      - overtchat-stt-models:/models
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

  # Code execution sandbox. Off by default; opt in by setting
  # OVERTCHAT_SANDBOX_URL=http://sandbox:8080 in .env, then:
  #   docker compose --profile sandbox up -d        (Python data, chart and document libraries)
  #   docker compose --profile sandbox-full up -d   (adds pandoc, LibreOffice, OCR and ffmpeg)
  # Runs are stateless and isolated per user; the container needs the
  # capabilities below to switch each run to a fresh unprivileged user. It has
  # no volumes, secrets or internet access, and is reachable as
  # `http://sandbox:8080` only on the internal `sandbox` network.
  sandbox: &sandbox
    image: ghcr.io/yoloyash/overtchat-sandbox:${SANDBOX_VERSION:-0.1.0}
    build:
      context: ./sandbox
      target: slim
    container_name: overtchat-sandbox
    restart: unless-stopped
    profiles: [sandbox]
    init: true
    read_only: true
    tmpfs:
      - /runs:size=2g,mode=0711
      - /tmp:size=256m
    cap_drop: [ALL]
    cap_add: [SETUID, SETGID, CHOWN, DAC_OVERRIDE, FOWNER, KILL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 512
    mem_limit: 6g
    environment:
      SANDBOX_TOKEN: ${SANDBOX_TOKEN:-}
    networks:
      sandbox:
        aliases: [sandbox]

  sandbox-full:
    <<: *sandbox
    image: ghcr.io/yoloyash/overtchat-sandbox-full:${SANDBOX_VERSION:-0.1.0}
    build:
      context: ./sandbox
      target: full
    container_name: overtchat-sandbox-full
    profiles: [sandbox-full]

  # To expose overtchat via Cloudflare Tunnel, uncomment below and paste your
  # tunnel token. Nothing else on this stack is reachable from the internet —
  # searxng and kokoro stay on the internal Docker network.
  #
  # cloudflared:
  #   image: docker.io/cloudflare/cloudflared@sha256:0aa26e284f05e6c77ae375b8c9c11d9eb6a448fb7bcd8d40f31cb6176189eb38
  #   container_name: overtchat-cloudflared
  #   restart: unless-stopped
  #   command: tunnel --no-autoupdate run
  #   environment:
  #     TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN}
  #   depends_on:
  #     app:
  #       condition: service_started

networks:
  # Shared only by the app and the sandbox, with no route to the internet.
  sandbox:
    internal: true

volumes:
  overtchat-data:
  overtchat-npm-cache:
  overtchat-stt-models:
